services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: consulos_dev
      POSTGRES_USER: consulos
      POSTGRES_PASSWORD: consulos_dev_pass
    ports:
      # 5433 côté hôte : évite le conflit avec PostgreSQL Windows sur 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consulos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis_dev_pass
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Ports hôtes 1026/8026 : 1025/8025 souvent pris (Mailpit eConsulat, etc.)
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  postgres_data:
  minio_data:

spring:
  application:
    name: consulos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/consulos_dev}
    username: ${POSTGRES_USER:consulos}
    password: ${POSTGRES_PASSWORD:consulos_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_pass}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

consulos:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:consulos}
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  sms:
    enabled: ${CONSULOS_SMS_ENABLED:false}
    provider: ${CONSULOS_SMS_PROVIDER:log}
    from-number: ${CONSULOS_SMS_FROM:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      api-base: ${TWILIO_API_BASE:https://api.twilio.com}
  payment:
    enabled: ${CONSULOS_PAYMENT_ENABLED:false}
    provider: ${CONSULOS_PAYMENT_PROVIDER:log}
    simulate-url: ${CONSULOS_PAYMENT_SIMULATE_URL:http://localhost:3000/caisse/paiement-en-ligne}
    success-url: ${CONSULOS_PAYMENT_SUCCESS_URL:http://localhost:3000/caisse?payment=success}
    cancel-url: ${CONSULOS_PAYMENT_CANCEL_URL:http://localhost:3000/caisse?payment=cancel}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  ocr:
    enabled: ${CONSULOS_OCR_ENABLED:false}
    provider: ${CONSULOS_OCR_PROVIDER:log}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{userId}] [%X{organisationId}] [%X{requestId}] %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    root: INFO
    com.consulos: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

server:
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}

logging:
  level:
    root: INFO
    com.consulos: INFO

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}

  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.consulos: INFO

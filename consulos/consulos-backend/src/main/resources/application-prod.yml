spring:
  datasource:
    url: ${POSTGRES_URL}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.consulos: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/consulos/application.log

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

server:
  ssl:
    enabled: ${SSL_ENABLED:false}

consulos:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://consulos.local}
  observability:
    prometheus-anonymous: ${CONSULOS_PROMETHEUS_ANONYMOUS:false}
